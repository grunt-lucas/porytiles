    type: std::size_t
    parser: parse_size_t
    default_value: "10240"
    validators: [ size_t_val_greater_than_zero ]
    cross_field_validators: [ ]

  - canonical_name: Number Of Tiles Per Metatile
    symbol: num_tiles_per_metatile
    yaml_path: fieldmap.num_tiles_per_metatile

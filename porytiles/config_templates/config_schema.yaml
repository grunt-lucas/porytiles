  - canonical_name: Extrinsic Transparency
    symbol: extrinsic_transparency
    yaml_path: tileset.extrinsic_transparency
    cli_option: extrinsic-transparency
    cli_desc: The RGB color to treat as transparent during compilation.
    layer: domain
    type: Rgba32
    parser: parse_rgba32
    default_value: "rgba_magenta"
    validators: [ rgba_alpha_component_opaque ]
    cross_field_validators: [ ]

  - canonical_name: Ignore Triple Layer Content
    symbol: ignore_triple_layer_content
    yaml_path: tileset.ignore_triple_layer_content
    cli_option: ignore-triple-layer-content
    cli_desc: >-
      Demote the triple-layer-content-in-dual-mode error to a warning. When on, a metatile with content on all three
      layers compiles in dual mode by dropping one layer group instead of failing. The dropped layer follows the
      metatile's effective layer type: a 'layer_type' role pin if you set one, otherwise the bottom layer.
    layer: domain
    type: bool
    parser: parse_bool
    default_value: "false"
    validators: [ ]
    cross_field_validators: [ ]

  - canonical_name: Tiles Edit Mode
    symbol: tiles_edit_mode
    yaml_path: tileset.tiles.edit_mode

# Configuration Schema for Porytiles
# This file defines all configuration values that will be auto-generated
#
# Fields:
#   canonical_name: Human-readable display name for the config value
#
#   symbol: C++ method name / programmatic identifier for the config value
#
#   yaml_path: Dot-separated YAML path (e.g., "fieldmap.num_tiles_in_primary")
#
#   header_define: (optional) Name of the #define macro in header files for HeaderDefineProvider
#     - Only supported for std::size_t types
#     - Example: "NUM_TILES_IN_PRIMARY" to match "#define NUM_TILES_IN_PRIMARY 512"
#
#   cli_option: CLI option name (e.g., "num-tiles-in-primary")
#
#   cli_desc: (optional) Custom description for CLI --help output
#     - When absent, templates fall back to using canonical_name
#     - Use this to provide more user-friendly CLI descriptions without changing canonical_name
#
#   yaml_only: (optional, default false) When true, this config value can only be set via YAML
#     - Excludes from CLI integration and any other non-YAML providers
#     - Use for complex types that cannot be reasonably expressed on the command line
#     - Example: std::vector<PaletteHint>, PerAnimOverrides
#
#   type: C++ type for the value
#
#   parser: Parser function name (e.g., "parse_size_t") - used by all providers
#
#   layer: Configuration layer (domain/app/infra)
#
#   default_value: Default value for DefaultProvider (C++ expression as string)
#
#   validators: List of validator function names to apply (required, use empty list [] if none)
#     - Validators are chainable functions taking ConfigValue<T> and returning ChainableResult<ConfigValue<T>>
#     - Defined in xcut/config/config_validators.hpp or <layer>/config/<layer>_config_validators.hpp
#     - Applied in sequence after fetching from provider, before returning to caller
#     - Example: [size_t_val_greater_than_zero]
#
#   cross_field_validators: List of cross-field validators that can access other config values (required, use empty list [] if none)
#     - Applied after regular validators, have access to config object and can fetch other values
#     - Defined in xcut/config/config_validators.hpp or <layer>/config/<layer>_config_validators.hpp
#     - Reference syntax: "<validator_func_name>:<field_name>"
#     - Example: [compare_greater_than:num_tiles_primary]
#
# Settings vs. override knobs:
#   Every entry is one of two kinds, distinguished by its type and default:
#
#   - A SETTING has a plain type and a static default (e.g. num_tiles_in_primary: std::size_t, default 512).
#     The default IS the answer when nothing else provides one; consumers use the resolved value directly.
#
#   - An OVERRIDE KNOB has an optional type and a std::nullopt default (e.g. metatile_attribute_size,
#     metatile_attribute_declaration_size). Here nullopt is a definite answer:
#     "the user did not pin this value". Exactly one consumer, the domain reconciler
#     (reconcile_metatile_attribute_schema), interprets that absence, by deriving the value from project
#     facts or falling back to a documented assumption. No provider may "helpfully" fill an override knob
#     with a derived value: a ConfigProvider reads stated values (a CLI flag, a YAML key, a header #define);
#     it never derives one. Derivation belongs in the domain, where it can see every other resolved value.

# ============================================================================
# Enum Type Definitions
# ============================================================================
# Enum types are defined here and used to generate:
#   - Enum header files (enum class, *_from_str(), to_string(), ostream operator)
#   - CLI registration code (CheckedTransformer maps)
#   - CLI completion data (enum choices)
#
# Fields:
#   cpp_type: The C++ enum class name (e.g., "ArtifactEditMode")
#
#   header_path: Output path relative to include/ (e.g., "porytiles/domain/config/artifact_edit_mode.hpp")
#
#   brief: Brief description for the enum class (used in Doxygen @brief)
#
#   details: (optional) Detailed description (used in Doxygen @details)
#
#   enum_values: List of enum values, each with:
#     - name: The C++ enum constant name (snake_case)
#     - cli_completion_name: The name to show for CLI tab completion
#     - fuzzy_names: (optional) List of fuzzy names for case-insensitive matching; auto-computed as [name, kebab-name] if not provided
#     - brief: Brief description for this value (used in Doxygen @brief)

enum_types:
  - cpp_type: ArtifactEditMode
    header_path: porytiles/domain/config/artifact_edit_mode.hpp
    brief: Specifies whether artifacts (tiles or palettes) can be modified during patch compilation.
    details: |
      Controls the behavior of tile and palette handling when compiling a tileset patch. In locked mode,
      the compiler must use only the existing artifacts from the base tileset without modifications. In
      patch mode, the compiler can modify unused or "open" slots as needed. In optimize mode, artifacts
      are cleared and packed optimally (Porytiles1 behavior).
    enum_values:
      - name: locked
        cli_completion_name: locked
        fuzzy_names: [ locked ]
        brief: Artifacts cannot be edited; must use existing from base tileset.
      - name: patch
        cli_completion_name: patch
        fuzzy_names: [ patch ]
        brief: Artifacts can be freely edited in "open" slots during compilation.
      - name: optimize
        cli_completion_name: optimize
        fuzzy_names: [ optimize ]
        brief: The Porytiles1 behavior; artifact is cleared and packed optimally.

  - cpp_type: TilesPaletteMode
    header_path: porytiles/domain/config/tiles_palette_mode.hpp
    brief: Controls how tiles.png is rendered.
    enum_values:
      - name: true_color
        cli_completion_name: true-color
        fuzzy_names: [ true-color, true_color, truecolor, color ]
        brief: Render tiles with true colors from the palette.
      - name: greyscale
        cli_completion_name: greyscale
        fuzzy_names: [ greyscale, grayscale, grey, gray ]
        brief: Render tiles in greyscale (useful for debugging).

  - cpp_type: AnimPaletteResolutionStrategy
    header_path: porytiles/domain/config/anim_palette_resolution_strategy.hpp
    brief: Strategy for determining which palette to use when decompiling animation tiles.
    details: |
      When decompiling animation tiles, the decompiler needs to know which tileset palette to use for
      converting indexed pixels to RGBA. This enum determines the strategy used to find that palette.
      The strategy is applied directly.
    enum_values:
      - name: scan_local_metatiles
        cli_completion_name: scan-local-metatiles
        fuzzy_names: [ scan-local-metatiles, scan_local_metatiles, scanlocalmetatiles ]
        brief: Scan local tileset metatile entries to find palette references for the animation tiles.
      - name: palette_00
        cli_completion_name: palette-00
        fuzzy_names: [ palette-00, palette_00, palette00, pal-0, pal_0, pal0, palette-0, palette_0, palette0 ]
        brief: Use palette 00 directly.
      - name: palette_01
        cli_completion_name: palette-01
        fuzzy_names: [ palette-01, palette_01, palette01, pal-1, pal_1, pal1, palette-1, palette_1, palette1 ]
        brief: Use palette 01 directly.
      - name: palette_02
        cli_completion_name: palette-02
        fuzzy_names: [ palette-02, palette_02, palette02, pal-2, pal_2, pal2, palette-2, palette_2, palette2 ]
        brief: Use palette 02 directly.
      - name: palette_03
        cli_completion_name: palette-03
        fuzzy_names: [ palette-03, palette_03, palette03, pal-3, pal_3, pal3, palette-3, palette_3, palette3 ]
        brief: Use palette 03 directly.
      - name: palette_04
        cli_completion_name: palette-04
        fuzzy_names: [ palette-04, palette_04, palette04, pal-4, pal_4, pal4, palette-4, palette_4, palette4 ]
        brief: Use palette 04 directly.
      - name: palette_05
        cli_completion_name: palette-05
        fuzzy_names: [ palette-05, palette_05, palette05, pal-5, pal_5, pal5, palette-5, palette_5, palette5 ]
        brief: Use palette 05 directly.
      - name: palette_06
        cli_completion_name: palette-06
        fuzzy_names: [ palette-06, palette_06, palette06, pal-6, pal_6, pal6, palette-6, palette_6, palette6 ]
        brief: Use palette 06 directly.
      - name: palette_07
        cli_completion_name: palette-07
        fuzzy_names: [ palette-07, palette_07, palette07, pal-7, pal_7, pal7, palette-7, palette_7, palette7 ]
        brief: Use palette 07 directly.
      - name: palette_08
        cli_completion_name: palette-08
        fuzzy_names: [ palette-08, palette_08, palette08, pal-8, pal_8, pal8, palette-8, palette_8, palette8 ]
        brief: Use palette 08 directly.
      - name: palette_09
        cli_completion_name: palette-09
        fuzzy_names: [ palette-09, palette_09, palette09, pal-9, pal_9, pal9, palette-9, palette_9, palette9 ]
        brief: Use palette 09 directly.
      - name: palette_10
        cli_completion_name: palette-10
        fuzzy_names: [ palette-10, palette_10, palette10, pal-10, pal_10, pal10 ]
        brief: Use palette 10 directly.
      - name: palette_11
        cli_completion_name: palette-11
        fuzzy_names: [ palette-11, palette_11, palette11, pal-11, pal_11, pal11 ]
        brief: Use palette 11 directly.
      - name: palette_12
        cli_completion_name: palette-12
        fuzzy_names: [ palette-12, palette_12, palette12, pal-12, pal_12, pal12 ]
        brief: Use palette 12 directly.
      - name: palette_13
        cli_completion_name: palette-13
        fuzzy_names: [ palette-13, palette_13, palette13, pal-13, pal_13, pal13 ]
        brief: Use palette 13 directly.
      - name: palette_14
        cli_completion_name: palette-14
        fuzzy_names: [ palette-14, palette_14, palette14, pal-14, pal_14, pal14 ]
        brief: Use palette 14 directly.
      - name: palette_15
        cli_completion_name: palette-15
        fuzzy_names: [ palette-15, palette_15, palette15, pal-15, pal_15, pal15 ]
        brief: Use palette 15 directly.
      - name: internal_png_palette
        cli_completion_name: internal-png-palette
        fuzzy_names: [ internal-png-palette, internal_png_palette, internal-png-pal, internal_png_pal, internalpngpal ]
        brief: Use the Porymap-component frame PNG internal palette, if present.
      - name: scan_all_tilesets
        cli_completion_name: scan-all-tilesets
        fuzzy_names: [ scan-all-tilesets, scan_all_tilesets, scanalltilesets, full-tileset-scan, full_tileset_scan, fulltilesetscan ]
        brief: Scan layouts config and find all tilesets paired with current tileset, see if an index is present in any.

  - cpp_type: FrameLinking
    header_path: porytiles/domain/config/frame_linking.hpp
    brief: Controls how animation frames are linked to metatile entries.
    details: |
      In automatic mode, Porytiles generates and uses key.png for frame linking.
      In manual mode, Porytiles uses explicit overrides specified in anim.json.
    enum_values:
      - name: automatic
        cli_completion_name: automatic
        fuzzy_names: [ automatic, auto ]
        brief: Use key.png for frame linking.
      - name: manual
        cli_completion_name: manual
        fuzzy_names: [ manual ]
        brief: Use manual overrides in anim.json.
      - name: hybrid
        cli_completion_name: hybrid
        fuzzy_names: [ hybrid ]
        brief: Automatic key.png linking plus manual override pass (not yet implemented).

  - cpp_type: AnimKeyFrameResolutionStrategy
    header_path: porytiles/domain/config/anim_key_frame_resolution_strategy.hpp
    brief: Strategy for handling duplicate key frame tiles in animation decompilation.
    details: |
      When decompiling animations, it's possible for multiple key frame tiles to be identical. This is
      problematic because during recompilation, identical tiles cannot be distinguished. This enum
      determines how to handle such cases.
    enum_values:
      - name: error
        cli_completion_name: error
        fuzzy_names: [ error, err ]
        brief: Emit a formatted error and fail decompilation.
      - name: warning
        cli_completion_name: warning
        fuzzy_names: [ warning, warn ]
        brief: Emit a warning and continue decompilation.
      - name: mangle
        cli_completion_name: mangle
        fuzzy_names: [ mangle ]
        brief: Mangle duplicate tiles to make them unique, then backport changes to tiles.png.

  - cpp_type: TileSharingPacking
    header_path: porytiles/domain/config/tile_sharing_packing.hpp
    brief: Controls whether palette packing considers tile sharing shape group membership.
    details: |
      When set to off, the packer ignores shape groups entirely. When biased,
      a soft cost penalty steers shape group siblings toward different palettes. When
      optimal, co-placing siblings is rejected outright (not yet implemented).
    enum_values:
      - name: "off"
        cli_completion_name: "off"
        fuzzy_names: [ "off" ]
        brief: Packing ignores shape group membership (default).
      - name: biased
        cli_completion_name: biased
        fuzzy_names: [ biased ]
        brief: Soft penalty steers shape group siblings toward different palettes.
      - name: optimal
        cli_completion_name: optimal
        fuzzy_names: [ optimal ]
        brief: Hard constraint rejecting sibling co-placement (not yet implemented).

  - cpp_type: TileSharingAlignment
    header_path: porytiles/domain/config/tile_sharing_alignment.hpp
    brief: Controls palette slot alignment strategy for tile sharing deduplication.
    details: |
      When set to off, palettes are filled sequentially with no sharing attempt.
      When greedy, indirect links align palette slot indices for color-isomorphic
      tiles. When optimal, a CSP-based solver finds globally optimal alignment (not yet implemented).
    enum_values:
      - name: "off"
        cli_completion_name: "off"
        fuzzy_names: [ "off" ]
        brief: Pure sequential fill with no sharing alignment (default).
      - name: greedy
        cli_completion_name: greedy
        fuzzy_names: [ greedy ]
        brief: Best-effort alignment via indirect link resolution.
      - name: optimal
        cli_completion_name: optimal
        fuzzy_names: [ optimal ]
        brief: CSP-based globally optimal alignment (not yet implemented).

  - cpp_type: PrimaryPairingMode
    header_path: porytiles/app/config/primary_pairing_mode.hpp
    brief: Controls how a secondary tileset finds its partner primary for compilation.
    details: |
      When compiling a secondary tileset, the compiler needs the compiled primary
      tileset to produce correct global tile indices and palette references.
      This mode controls how the partner primary is resolved.
    enum_values:
      - name: "off"
        cli_completion_name: "off"
        fuzzy_names: [ "off", "none", "disabled" ]
        brief: Skip primary loading entirely. Compile as a standalone secondary.
      - name: manual
        cli_completion_name: manual
        fuzzy_names: [ manual ]
        brief: Use the partner primary specified via primary_pairing_partners config.
      - name: automatic
        cli_completion_name: automatic
        fuzzy_names: [ automatic, auto ]
        brief: Scan layout metadata to find the partner primary automatically.

  - cpp_type: PackingStrategyType
    header_path: porytiles/domain/config/packing_strategy_type.hpp
    brief: Selects the palette packing algorithm to use during tileset compilation.
    details: |
      Controls which algorithm is used to assign tiles to palettes. Each strategy offers different
      trade-offs between speed, solution quality, and configurability. Backtracking is the default
      and handles the widest range of inputs. Best Fusion is fast but may fail on hard instances.
      Overload-And-Remove uses multi-start retries to escape local optima.
    enum_values:
      - name: best_fusion
        cli_completion_name: best-fusion
        fuzzy_names: [ best-fusion, best_fusion, bestfusion ]
        brief: Greedy weighted-cost packing (fast, no retries).
      - name: backtracking
        cli_completion_name: backtracking
        fuzzy_names: [ backtracking ]
        brief: DFS/BFS backtracking search (default).
      - name: overload_and_remove
        cli_completion_name: overload-and-remove
        fuzzy_names: [ overload-and-remove, overload_and_remove, overloadandremove ]
        brief: Greedy with overload-and-remove multi-start retries.

  - cpp_type: SearchAlgorithm
    header_path: porytiles/domain/config/search_algorithm.hpp
    brief: Search algorithm used by BacktrackingStrategy.
    details: |
      Controls whether the backtracking search explores the solution space using depth-first or breadth-first traversal.
      DFS uses in-place mutation with undo for memory efficiency, while BFS uses visited-state deduplication and a
      dual-queue heuristic.
    enum_values:
      - name: dfs
        cli_completion_name: dfs
        fuzzy_names: [ dfs, depth-first, depth_first, depthfirst ]
        brief: Depth-first search with in-place mutation and undo.
      - name: bfs
        cli_completion_name: bfs
        fuzzy_names: [ bfs, breadth-first, breadth_first, breadthfirst ]
        brief: Breadth-first search with dual-queue heuristic and visited-state deduplication.

  - cpp_type: ShuffleStrategy
    header_path: porytiles/domain/config/shuffle_strategy.hpp
    brief: Controls how tile orderings are generated during multi-start packing.
    details: |
      The packing algorithm can attempt multiple tile orderings to find a valid solution. This enum
      controls the strategy used to generate those orderings after the initial FFD (First Fit Decreasing)
      attempt.
    enum_values:
      - name: single_ffd
        cli_completion_name: single-ffd
        fuzzy_names: [ single-ffd, single_ffd, singleffd ]
        brief: One FFD attempt only, no multi-start retries.
      - name: noisy_ffd
        cli_completion_name: noisy-ffd
        fuzzy_names: [ noisy-ffd, noisy_ffd, noisyffd ]
        brief: FFD first, then perturbed FFD orderings that preserve the large-first property.
      - name: random
        cli_completion_name: random
        fuzzy_names: [ random ]
        brief: FFD first, then fully random shuffles (original behavior).

  - cpp_type: AnimMultiPaletteSubtileResolutionStrategy
    header_path: porytiles/domain/config/anim_multi_palette_subtile_resolution_strategy.hpp
    brief: Strategy for handling animation subtiles referenced with multiple palettes.
    details: |
      When decompiling animations using the scan_local_metatiles strategy, a single tile index
      can be referenced by multiple metatile entries with different palette indices. This is valid
      GBA behavior (the hardware selects palette per metatile entry, not per tile), but Porytiles
      cannot represent multiple palette variants in a single RGBA layer PNG. This enum determines
      how to handle such cases.
    enum_values:
      - name: error
        cli_completion_name: error
        fuzzy_names: [ error, err ]
        brief: Emit a formatted error and fail decompilation.
      - name: warning
        cli_completion_name: warning
        fuzzy_names: [ warning, warn ]
        brief: Emit a warning and continue decompilation using the lowest palette index.
      - name: split
        cli_completion_name: split
        fuzzy_names: [ split ]
        brief: Split the animation into separate animations for each palette variant (not yet implemented).

config_values:
  # Domain Layer Configuration Values
  - canonical_name: Number Of Tiles In Primary
    symbol: num_tiles_in_primary
    yaml_path: fieldmap.num_tiles_in_primary
    header_define: NUM_TILES_IN_PRIMARY
    cli_option: num-tiles-in-primary
    cli_desc: The NUM_TILES_IN_PRIMARY setting from include/fieldmap.h.
    layer: domain
    type: std::size_t
    parser: parse_size_t
    default_value: "512"
    validators: [ size_t_val_greater_than_zero ]
    cross_field_validators: [ compare_less_equal:num_tiles_total ]

  - canonical_name: Number Of Tiles Total
    symbol: num_tiles_total
    yaml_path: fieldmap.num_tiles_total
    header_define: NUM_TILES_TOTAL
    cli_option: num-tiles-total
    cli_desc: The NUM_TILES_TOTAL setting from include/fieldmap.h.
    layer: domain
    type: std::size_t
    parser: parse_size_t
    default_value: "1024"
    validators: [ size_t_val_greater_than_zero ]
    cross_field_validators: [ compare_greater_equal:num_tiles_in_primary ]

  - canonical_name: Number Of Metatiles In Primary
    symbol: num_metatiles_in_primary
    yaml_path: fieldmap.num_metatiles_in_primary
    header_define: NUM_METATILES_IN_PRIMARY
    cli_option: num-metatiles-in-primary
    cli_desc: The NUM_METATILES_IN_PRIMARY setting from include/fieldmap.h.
    layer: domain
    type: std::size_t
    parser: parse_size_t
    default_value: "512"
    validators: [ size_t_val_greater_than_zero ]
    cross_field_validators: [ compare_less_equal:num_metatiles_total ]

  - canonical_name: Number Of Metatiles Total
    symbol: num_metatiles_total
    yaml_path: fieldmap.num_metatiles_total
    header_define: NUM_METATILES_TOTAL

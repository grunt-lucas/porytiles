    yaml_path: tileset.palettes.packing.hints_enabled
    cli_option: pal-hints-enabled
    cli_desc: Enable configured palette hints.
    layer: domain
    type: bool
    parser: parse_bool
    default_value: "true"
    validators: [ ]
    cross_field_validators: [ ]

  - canonical_name: Palette Hints
    symbol: palette_hints
    yaml_path: tileset.palettes.packing.hints
    yaml_only: true  # Too complex for non-YAML providers (std::vector<PaletteHint>)
    layer: domain
    type: std::vector<PaletteHint>
    parser: parse_palette_hints
    default_value: "std::vector<PaletteHint>{}"
    validators: [ ]
    cross_field_validators: [ ]

  - canonical_name: Packing Strategy
    symbol: packing_strategy
    yaml_path: tileset.palettes.packing.strategy
    cli_option: packing-strategy
    cli_desc: The palette packing algorithm to use during compilation.
    layer: domain

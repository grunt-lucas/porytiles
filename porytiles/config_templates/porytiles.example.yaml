# Example porytiles.yaml

fieldmap:
  num_tiles_in_primary: 512
  num_tiles_total: 1024
  num_metatiles_in_primary: 512
  num_metatiles_total: 1024
  num_pals_in_primary: 6
  num_pals_total: 13
  max_map_data_size: 10240
  num_tiles_per_metatile: 8

  # Emit and honor a trailing "layerType" column in the metatile attributes CSV. When true, a filled cell
  # ("normal", "covered", or "split") pins that metatile's layer type against inference, and a blank cell means
  # auto/inferred. When false (the default), any layerType column present is ignored (with a warning) and layer types
  # are inferred. Usually set per tileset in porytiles/tilesets/<name>/config.yaml.
  write_layer_type_column: false

  # Whether to select the FireRed/LeafGreen alternate metatile attribute masks for a tileset. Values:
  #   automatic - cross-reference data/layouts/layouts.json (a tileset used only by frlg layouts gets the FRLG masks)
  #   always    - always use the FRLG alternate masks (true is accepted as an alias)
  #   never     - always use the primary masks (false is accepted as an alias)
  # This is really a per-tileset setting; prefer setting it in porytiles/tilesets/<name>/config.yaml.
  use_frlg_alternate_masks: automatic

diagnostics:
  warnings:
    exclude: [ ".*" ]
    include: # explicitly include only two warnings, include processed after exclude
      - "layer-mode-warning"
      - "tile-color-count-warning"
  remarks:
    exclude: [ ".*" ] # disable all remarks

verify_checksums: true

tileset:
  extrinsic_transparency: [ 255, 0, 255 ]

  # Configure where Porytiles-managed tileset artifacts are stored.
  # These paths are relative to the project root.
  # - src: Where Porytiles-format source assets are stored (porytiles_src/)
  # - bin: Where Porymap-format binary assets are stored (porytiles_bin/)
  paths:
    primary:
      src: data/tilesets/primary
      bin: data/tilesets/primary
    secondary:
      src: data/tilesets/secondary
      bin: data/tilesets/secondary

  tiles:
    # Set edit mode for the tiles artifact.
    # Allowed values:
    # - locked: no changes allowed to tiles.png
    # - patch: allow additions to tiles.png in transparent slots
    # - [default] optimize: current Porytiles1 behavior; clear the whole tile workspace and pack tiles optimally
    edit_mode: locked

    # Set palette mode for output 'tiles.png'
    # Allowed values:
    # - [default] true-color: 8-bit index value, full output pal stored in PNG, upper 4 bits map into pal for true-color output
    # - greyscale: greyscale palette mapped to index values: [0, 15] -> [[255,255,255], [0,0,0]]
    palette_mode: true-color

    # Tile sharing configuration: palette slot alignment for color-isomorphic tiles.
    # When two palettes have corresponding colors at the same slot indices, a single
    # tile can render with either palette (e.g., red vs blue building).
    sharing:
      # Packing: controls whether the packer considers shape group membership.
      # Allowed values:
      # - [default] off: packing ignores shape group membership
      # - biased: soft penalty steers shape group siblings toward different palettes
      # - optimal: hard constraint rejecting sibling co-placement (not yet implemented)
      packing: off

      # Alignment: controls palette slot alignment strategy for tile sharing deduplication.
      # Allowed values:
      # - [default] off: pure sequential fill with no sharing alignment
      # - greedy: best-effort alignment via indirect link resolution
      # - optimal: CSP-based globally optimal alignment (not yet implemented)
      alignment: off

  palettes:
    # Set edit mode for the palette artifacts.
    # Allowed values:
    # - locked: no changes allowed to Porymap palettes
    # - patch: allow additions to palettes in unused slots
    # - [default] optimize: current Porytiles1 behavior; clear the palettes and pack optimally
    edit_mode: locked

    # in edit_mode: locked, if not palette matches, show closest n matches in diagnostic output
    match_candidate_top_n: 1

    packing:
      # Palette packing algorithm.
      # Allowed values:
      # - [default] backtracking: DFS/BFS backtracking search
      # - best-fusion: greedy weighted-cost packing (fast, no retries)
      # - overload-and-remove: greedy with multi-start retries
      strategy: backtracking

      # Per-strategy tuning parameters. When omitted or empty, strategies use built-in preset matrix mode.
      # Only the block matching the selected strategy is consulted at runtime.
      strategy_params:
        backtracking:
          search_algorithm: bfs       # dfs or bfs
          node_cutoff: 5000           # max nodes to explore before giving up
          best_branches: 3            # keep top-N branches at each level
          smart_prune: true           # enable heuristic pruning
        overload_and_remove:
          max_attempts: 100           # number of multi-start retries
          seed: 42                    # RNG seed for reproducibility
          shuffle_strategy: noisy-ffd # single-ffd, noisy-ffd, or random

      # Enable or disable palette hints. When true, the hints below are fed
      # into the packing algorithm as virtual tiles to guide color grouping.
      hints_enabled: true

      # Palette hints tell the packer that certain colors should land in the
      # same hardware palette. Each hint is a named group of RGB colors. The
      # packer injects these as synthetic tiles before packing, biasing the
      # algorithm to keep the listed colors together.
      #
      # Useful when you know certain colors co-occur on-screen (e.g. foliage
      # greens) and want to guarantee they share a palette slot, even if the
      # packer's heuristic wouldn't discover that grouping on its own.
      hints:
        - name: "foliage"
          colors:
            - [ 12, 190, 20 ]
            - [ 40, 210, 10 ]

  animations:
    # When true (default), Porytiles will wire the generated animation code into
    # tileset_anims.c/h and update the .callback field in headers.h. Set to false
    # if you want Porytiles to generate animation frames and code but handle
    # wiring yourself.
    wire_anim_code: true

    # Strategy for determining which palette to use when decompiling animation tiles.
    # The strategy drives palette resolution from the start. Available strategies:
    # - [default] scan-local-metatiles: Scan local metatile entries to find palette references.
    # - palette-00 through palette-15: Use the specified palette index directly.
    # - internal-png-palette: Match frame PNG internal palettes against tileset palettes.
    # - scan-all-tilesets: Scan layouts config for paired tilesets (not yet implemented).
    palette_resolution_strategy: scan-local-metatiles

    # Strategy for determining how to resolve duplicate key frame subtile errors when decompiling an animation.
    # Available strategies:
    # - [default] error: error out and display violating duplicate pairs
    # - warning: warn about violating duplicate pairs and continue decompilation (noting that subsequent compilation will fail if no action is taken)
    # - mangle: run the AnimTileMangler to minimally de-dupe tiles
    key_frame_resolution_strategy: warning

    # Strategy for handling animation subtiles referenced with multiple palettes.
    # Available strategies:
    # - [default] error: error out and display the conflicting palettes
    # - warning: warn and continue decompilation using the lowest palette index
    # - split: split the animation into separate animations for each palette variant (not yet implemented)
    multi_palette_subtile_resolution_strategy: error

    # Default frame linking mode for animations.
    # Per-animation overrides can override this. Available modes:
    # - [default] automatic: use key.png for frame linking
    # - manual: use explicit overrides in anim.json
    frame_linking: automatic

    # Per-animation configuration. Each key is an animation name.
    # Animations not listed here fall back to the settings above.
    #
    # Palette resolution follows a three-tier cascade (most specific wins):
    #   1. per_tile_palette_resolution_strategies[i] — per-subtile override
    #   2. palette_resolution_strategy — per-animation default
    #   3. palette_resolution_strategy (above) — global fallback
    per_animation_overrides:
      flower:
        # How frames are linked to metatile entries.
        # - automatic: use key.png for frame linking (default)
        # - manual: use explicit overrides in anim.json
        frame_linking: automatic

        # Per-animation key frame resolution strategy override.
        # If set, overrides the global anim_key_frame_resolution_strategy for this animation.
        key_frame_resolution_strategy: mangle

        # Per-animation multi-pal subtile resolution strategy override.
        # If set, overrides the global multi_palette_subtile_resolution_strategy for this animation.
        multi_palette_subtile_resolution_strategy: warning

        # Per-animation palette resolution strategy (middle tier).
        # Applied to all subtiles that don't have a per-tile override.
        palette_resolution_strategy: pal0

        # Per-subtile palette resolution strategies. Must have exactly one entry per subtile.
        # Use "_" to fall back to palette_resolution_strategy (or global if not set).
        per_tile_palette_resolution_strategies: [ _, scan-local-metatiles, _, _ ]

  # Primary pairing configuration for secondary tileset compilation.
  # When compiling a secondary tileset, the compiler needs the compiled primary
  # tileset to produce correct global tile indices and palette references.
  primary_pairing:
    # How the partner primary is resolved.
    # Allowed values:
    # - off: skip primary loading entirely, compile as a standalone secondary
    # - manual: use the partner primaries listed in 'partners' below
    # - [default] automatic: scan layout metadata to find the partner primary
    mode: automatic

    # Tileset names to use as partner primaries in manual pairing mode.
    # Only consulted when mode is 'manual'. Each entry is a tileset struct name.
    # partners:
    #   - gTileset_General

  # Set transparency handling for import.
  # Allowed values:
  # - alpha: all transparent tiles are set to alpha=0
  # - extrinsic: all transparent tiles are set to extrinsic transparency [default]
  # - mixed:
  #     - in dual-layer mode:
  #       - the missing layer is set to alpha=0
  #       - transparency on the present layer is set to extrinsic
  #     - in triple-layer mode:
  #       - effectively equivalent to extrinsic
  import_transparency: extrinsic

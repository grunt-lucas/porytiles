# Configuration Schema for Porytiles2
# This file defines all configuration values that will be auto-generated
#
# Fields:
#   name: Method name for the config value
#   type: C++ type for the value
#   parser: Parser function name (e.g., "parse_size_t") - shared across all providers (if relevant)
#   layer: Configuration layer (domain/app/infra)
#   scope_type: Method parameter scope (tileset/layout)
#     - tileset: Takes const std::string &tileset parameter
#     - layout: Takes const std::string &layout parameter
#   default_value: Default value for DefaultProvider (C++ expression as string)
#   yaml: YAML configuration for YamlFileProvider
#     path: Dot-separated YAML path (e.g., "fieldmap.num_tiles_primary")

# TODO: config validation
# We need a more robust system for logical config validation.
# The parser functions can obviously validate that the literal provided config value is valid.
# However, some config values may need additional source-independent validation.
# E.g. imagine we have a future "select_top_n_results" config setting.
# Here, the type and parser will be std::size_t, which will prevent users from supplying strings, negative values, etc.
# However, even within the valid size_t range, we still want to restrict the value from being 0,
# since 0 makes no sense in a top_n selector. So we'd need additional validation that forces the value to be at least 1.
#
# One idea I had for this: we have two versions of each config fetching function.
# In the layer config file, one protected virtual version called select_top_n_results_provider()
# which grabs the raw value from the provider.
# Then, the actual user-facing version called select_top_n_results() which calls the virtual version
# and also does the validation. Kinda like how num_x_secondary currently work in DomainConfig.
# Since we have a templating system, it should be easy to auto-generate both via the templates.
# Is there some way to provide value constraints in YAML that we can translate directly to cpp code?

config_values:
  # Domain Layer Configuration Values
  - name: num_tiles_primary
    type: std::size_t
    parser: parse_size_t
    layer: domain
    scope_type: tileset
    default_value: "512"
    yaml:
      path: fieldmap.num_tiles_primary

  - name: num_tiles_total
    type: std::size_t
    parser: parse_size_t
    layer: domain
    scope_type: tileset
    default_value: "1024"
    yaml:
      path: fieldmap.num_tiles_total

  - name: num_metatiles_primary
    type: std::size_t
    parser: parse_size_t
    layer: domain
    scope_type: tileset
    default_value: "512"
    yaml:
      path: fieldmap.num_metatiles_primary

  - name: num_metatiles_total
    type: std::size_t
    parser: parse_size_t
    layer: domain
    scope_type: tileset
    default_value: "1024"
    yaml:
      path: fieldmap.num_metatiles_total

  - name: num_pals_primary
    type: std::size_t
    parser: parse_size_t
    layer: domain
    scope_type: tileset
    default_value: "6"
    yaml:
      path: fieldmap.num_pals_primary

  - name: num_pals_total
    type: std::size_t
    parser: parse_size_t
    layer: domain
    scope_type: tileset
    default_value: "13"
    yaml:
      path: fieldmap.num_pals_total

  - name: max_map_data_size
    type: std::size_t
    parser: parse_size_t
    layer: domain
    scope_type: tileset
    default_value: "10240"
    yaml:
      path: fieldmap.max_map_data_size

  - name: num_tiles_per_metatile
    type: std::size_t
    parser: parse_size_t
    layer: domain
    scope_type: tileset
    default_value: "8"
    yaml:
      path: fieldmap.num_tiles_per_metatile

  - name: extrinsic_transparency
    type: Rgba32
    parser: parse_rgba32
    layer: domain
    scope_type: tileset
    default_value: "rgba_magenta"
    yaml:
      path: extrinsic_transparency

  - name: patch_build_enabled
    type: bool
    parser: parse_bool
    layer: domain
    scope_type: tileset
    default_value: "false"
    yaml:
      path: patch.enabled

  # Infrastructure Layer Configuration Values
  - name: tiles_pal_mode
    type: TilesPalMode
    parser: parse_tiles_pal_mode
    layer: infra
    scope_type: tileset
    default_value: "TilesPalMode::true_color"
    yaml:
      path: tiles_pal_mode

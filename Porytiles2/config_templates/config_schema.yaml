    cli_desc: The allowed edit mode for the palettes/ artifacts.
    layer: domain
    type: ArtifactEditMode
    parser: parse_artifact_edit_mode
    default_value: "ArtifactEditMode::optimize"
    validators: [ ]
    cross_field_validators: [ ]

  - canonical_name: Palette Hints Enabled
    symbol: pal_hints_enabled
    yaml_path: tileset.palettes.packing.hints_enabled
    cli_option: pal-hints-enabled
    cli_desc: Enable configured palette hints.
    layer: domain
    type: bool
    parser: parse_bool
    default_value: "true"
    validators: [ ]
    cross_field_validators: [ ]

  - canonical_name: Palette Hints
    symbol: pal_hints
    yaml_path: tileset.palettes.packing.hints
    cli_option: pal-hints
    cli_skip: true  # Too complex for CLI (std::vector<PaletteHint>)
    layer: domain
    type: std::vector<PaletteHint>
    parser: parse_pal_hints
    default_value: "std::vector<PaletteHint>{}"
    validators: [ ]
    cross_field_validators: [ ]

  - canonical_name: Tiles Palette Mode
    symbol: tiles_pal_mode
    yaml_path: tileset.tiles.palette_mode
    cli_option: tiles-pal-mode
    cli_desc: The color mode to use when saving the tiles.png artifact.
    layer: domain
    type: TilesPalMode
    parser: parse_tiles_pal_mode
    default_value: "TilesPalMode::true_color"
    validators: [ ]
    cross_field_validators: [ ]

  - canonical_name: Animation Palette Resolution Strategy
    symbol: anim_pal_resolution_strategy
    yaml_path: tileset.animations.palette_resolution_strategy
    cli_option: anim-pal-resolution-strategy
    cli_desc: The strategy to use when resolving the palette for an unreferenced animation.
    layer: domain
    type: AnimPalResolutionStrategy
    parser: parse_anim_pal_resolution_strategy
    default_value: "AnimPalResolutionStrategy::error"
    validators: [ ]
    cross_field_validators: [ ]

  - canonical_name: Animation Key Frame Resolution Strategy

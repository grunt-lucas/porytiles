    validators: [ size_t_val_greater_than_zero ]
    cross_field_validators: [ compare_less_equal:num_pals_total ]

  - canonical_name: Number Of Palettes Total
    symbol: num_pals_total
    yaml_path: fieldmap.num_pals_total
    header_define: NUM_PALS_TOTAL
    cli_option: num-pals-total
    cli_desc: The NUM_PALS_TOTAL setting from include/fieldmap.h.
    layer: domain
    type: std::size_t
    parser: parse_size_t
    default_value: "13"
    validators: [ size_t_val_greater_than_zero ]
    cross_field_validators: [ compare_greater_equal:num_pals_in_primary ]

  - canonical_name: Max Map Data Size
    symbol: max_map_data_size
    yaml_path: fieldmap.max_map_data_size
    header_define: MAX_MAP_DATA_SIZE
    cli_option: max-map-data-size
    cli_desc: The MAX_MAP_DATA_SIZE setting from include/fieldmap.h.
    layer: domain
    type: std::size_t
    parser: parse_size_t
    default_value: "10240"
    validators: [ size_t_val_greater_than_zero ]
    cross_field_validators: [ ]

  - canonical_name: Number Of Tiles Per Metatile
    symbol: num_tiles_per_metatile
    yaml_path: fieldmap.num_tiles_per_metatile
    header_define: NUM_TILES_PER_METATILE
    cli_option: num-tiles-per-metatile
    cli_desc: The NUM_TILES_PER_METATILE setting from include/fieldmap.h.
    layer: domain
    type: std::size_t
    parser: parse_size_t
    default_value: "8"
    validators: [ size_t_val_eight_or_twelve ]
    cross_field_validators: [ ]

  - canonical_name: Extrinsic Transparency
    symbol: extrinsic_transparency
    yaml_path: tileset.extrinsic_transparency
    cli_option: extrinsic-transparency
    cli_desc: The RGB color to treat as transparent during compilation.
    layer: domain
    type: Rgba32
    parser: parse_rgba32
    default_value: "rgba_magenta"
    validators: [ rgba_alpha_component_opaque ]
    cross_field_validators: [ ]

  - canonical_name: Tiles Edit Mode
    symbol: tiles_edit_mode
    yaml_path: tileset.tiles.edit_mode
    cli_option: tiles-edit-mode
    cli_desc: The allowed edit mode for the tiles.png artifact.
    layer: domain
    type: ArtifactEditMode
    parser: parse_artifact_edit_mode
    default_value: "ArtifactEditMode::optimize"
    validators: [ ]
    cross_field_validators: [ ]


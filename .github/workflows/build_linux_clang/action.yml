name: Build Linux Clang
description: Builds Porytiles on Linux with Clang

inputs:
  build-version:
    description: The build version to inject into the Porytiles build
    required: false
    default: default_build_version
  build-date:
    description: UTC build date (format YYYY.MM.DDTHH:MM:SS+00:00). Defaults to current UTC when empty.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build on Linux with clang
      shell: bash
      run: |
        export CC=clang
        export CXX=clang++
        BUILD_DATE="${{ inputs.build-date }}"
        if [ -z "$BUILD_DATE" ]; then
          BUILD_DATE="$(date -u +'%Y.%m.%dT%H:%M:%S+00:00')"
        fi

        # See https://github.com/grunt-lucas/porytiles/issues/345 for why
        # we static link here.
        MULTIARCH="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
        PNG_STATIC_LIB="/usr/lib/${MULTIARCH}/libpng.a"
        if [ ! -e "$PNG_STATIC_LIB" ]; then
          echo "ERROR: $PNG_STATIC_LIB not found; is libpng-dev installed?" >&2
          exit 1
        fi

        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -static-libstdc++ -static" \
          -DPNG_LIBRARY="$PNG_STATIC_LIB" \
          -DZLIB_USE_STATIC_LIBS=ON \
          -DPORYTILES_BUILD_VERSION_="${{ inputs.build-version }}" \
          -DPORYTILES_BUILD_DATE_="$BUILD_DATE"
        cd build
        cmake --build .
        file ./legacy/tools/driver/porytiles-legacy
        objdump -p ./legacy/tools/driver/porytiles-legacy
        file ./porytiles/tools/driver/porytiles
        objdump -p ./porytiles/tools/driver/porytiles

    - name: Verify executables are statically linked
      shell: bash
      run: |
        status=0
        for bin in \
          ./build/legacy/tools/driver/porytiles-legacy \
          ./build/porytiles/tools/driver/porytiles \
          ./build/legacy/tests/LegacyTests \
          ./build/porytiles/tests/PorytilesUnitTests \
          ./build/porytiles/tests/PorytilesIntegrationTests; do
          file "$bin"
          # `ldd` exits nonzero on a static executable, output is informational only
          ldd "$bin" || true
          if ! file "$bin" | grep -q "statically linked"; then
            echo "ERROR: $bin is not statically linked" >&2
            status=1
          fi
        done
        exit "$status"

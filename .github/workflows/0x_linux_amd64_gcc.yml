name: Linux AMD64 GCC Reusable 0.x Build Workflow

on:
  workflow_call:

jobs:
  build-0x-linux-amd64-gcc:
    name: Build 0.x on linux-amd64 with gcc
    runs-on: ubuntu-latest
    steps:
      - name: Install GCC and other build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install zlib1g-dev
          sudo apt-get install libpng-dev
          sudo apt-get install cmake
          sudo apt-get install g++
          g++ --version

      - name: Checkout porytiles
        uses: actions/checkout@v3

      - name: Build the project
        run: |
          export CXX=g++
          cd Porytiles-0.x
          cmake -B build
          cd build
          cmake --build .

      - name: Run the tests
        run: |
          ./Porytiles-0.x/build/tests/Porytiles0xTestSuite

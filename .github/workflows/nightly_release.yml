name: Porytiles Nightly Release
on:
  #  schedule:
  #    - cron: "00 05 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Block nightly release pipeline if release was already built from this commit
  check-already-built:
    name: Check if we already built a nightly from this commit SHA
    runs-on: 'ubuntu-latest'
    steps:
      - uses: octokit/request-action@v2.x
        id: check_last_run
        with:
          route: GET /repos/${{github.repository}}/actions/workflows/nightly_release.yml/runs?per_page=1&status=completed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: "echo Last nightly build: ${{fromJson(steps.check_last_run.outputs.data).workflow_runs[0].head_sha}}"
    outputs:
      last_sha: ${{fromJson(steps.check_last_run.outputs.data).workflow_runs[0].head_sha}}

  nightly-release-0x-linux-amd64:
    name: Release a 0.x linux-amd64 binary based on the develop branch
    runs-on: ubuntu-latest
    needs: [ check-already-built ]
    if: needs.check-already-built.outputs.last_sha != github.sha
    steps:
      - name: Install clang and other build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install zlib1g-dev
          sudo apt-get install libpng-dev
          sudo apt-get install cmake
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh all
          clang++ --version

      - name: Checkout the develop branch
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Create release package
        run: |
          ./Scripts/package.sh linux-amd64-clang nightly-${{github.sha}} .

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{github.sha}}
          files: porytiles-linux-amd64-clang.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly-release-0x-linux-arm64:
    name: Release a 0.x linux-arm64 binary based on the develop branch
    runs-on: ubuntu-24.04-arm
    needs: [ check-already-built ]
    if: needs.check-already-built.outputs.last_sha != github.sha
    steps:
      - name: Install clang and other build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install zlib1g-dev
          sudo apt-get install libpng-dev
          sudo apt-get install cmake
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh all
          clang++ --version

      - name: Checkout the develop branch
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Create release package
        run: |
          ./Scripts/package.sh linux-arm64-clang nightly-${{github.sha}} .

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{github.sha}}
          files: porytiles-linux-arm64-clang.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly-release-0x-macos-amd64:
    name: Release a 0.x macos-amd64 binary based on the develop branch
    runs-on: macos-13
    needs: [ check-already-built ]
    if: needs.check-already-built.outputs.last_sha != github.sha
    steps:
      - name: Install clang and dependencies
        run: |
          brew update
          brew install zlib || true
          brew install libpng || true
          brew install llvm || true
          /usr/local/opt/llvm/bin/clang++ --version
          /usr/local/opt/llvm/bin/clang++ -v

      - name: Checkout the develop branch
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Create release package
        run: |
          ./Scripts/package.sh macos-amd64-clang nightly-${{github.sha}} .

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{github.sha}}
          files: porytiles-macos-amd64-clang.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly-release-0x-macos-arm64:
    name: Release a 0.x macos-arm64 binary based on the develop branch
    runs-on: macos-latest
    # GitHub removed Intel Mac runners, so macos-latest is now arm64
    needs: [ check-already-built ]
    if: needs.check-already-built.outputs.last_sha != github.sha
    steps:
      - name: Install clang and dependencies
        run: |
          brew update
          brew install zlib || true
          brew install libpng || true
          brew install llvm || true
          /opt/homebrew/opt/llvm/bin/clang++ --version
          /opt/homebrew/opt/llvm/bin/clang++ -v

      - name: Checkout the develop branch
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Create release package
        run: |
          ./Scripts/package.sh macos-arm64-clang nightly-${{github.sha}} .

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{github.sha}}
          files: porytiles-macos-arm64-clang.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Linux AMD64 Clang Reusable 0.x Build Workflow

on:
  workflow_call:

jobs:
  build-0x-linux-amd64-clang:
    name: Build 0.x on linux-amd64 with clang
    runs-on: ubuntu-latest
    steps:
      - name: Install Clang+LLVM 16 and other build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install zlib1g-dev
          sudo apt-get install libpng-dev
          sudo apt-get install cmake
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16 all
          clang++-16 --version

      - name: Checkout porytiles
        uses: actions/checkout@v3

      - name: Build the project
        run: |
          export CXX=clang++-16
          cd Porytiles-0.x
          cmake -B build
          cd build
          cmake --build .

      - name: Run the tests
        run: |
          ./Porytiles-0.x/build/tests/Porytiles0xTestSuite

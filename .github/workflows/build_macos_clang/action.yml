name: Build MacOS Clang
description: Builds Porytiles on MacOS with Clang

inputs:
  build-version:
    description: The build version to inject into the Porytiles build
    required: false
    default: default_build_version

runs:
  using: composite
  steps:
    - name: Build on MacOS with clang
      shell: bash
      run: |
        export CXX=clang++
        BUILD_DATE=`date -uIseconds`
        cmake -B build \
          -DCMAKE_BUILD_TYPE="Release" \
          -DCMAKE_CXX_FLAGS="-DPORYTILES_BUILD_VERSION_=${{ inputs.build-version }} -DPORYTILES_BUILD_DATE_=${BUILD_DATE}" \
          -DCMAKE_FIND_FRAMEWORK="NEVER"
        cd build
        cmake --build .
        file ./Porytiles/cli/porytiles
        otool -L ./Porytiles/cli/porytiles
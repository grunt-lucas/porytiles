name: MacOS Clang Build Job Template

on:
  workflow_call:
    inputs:
      arch:
        description: Arch to use (amd64/arm64)
        required: true
        type: string
      image:
        description: OS image to use (ubuntu-latest, ubuntu-24.04-arm, macos-13 etc)
        required: true
        type: string

jobs:
  build-macos:
    name: Build on macos-${{ inputs.arch }} with clang
    runs-on: ${{ inputs.image }}
    steps:
      - name: Checkout Porytiles repository
        uses: actions/checkout@v4

      - name: Install Porytiles build dependencies
        uses: ./.github/workflows/install_dependencies_macos

      - name: Build the project
        uses: ./.github/workflows/build_macos_clang

      - name: Run the test suite
        uses: ./.github/workflows/run_test_suite